<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astro15 | Curated Chaos</title>
    <meta
      name="description"
      content="A calm black-and-purple personal site with separate pages for each section."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="bg-canvas"></canvas>
    <div class="noise"></div>

    <header class="site-header">
      <a class="brand" href="index.html">ASTRO15</a>
    </header>

    <main>
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">BLACK / PURPLE / QUIET</p>
          <h1>Hai! I’m JJ, and this is my corner of the web.</h1>
          <p class="lead">
            This version keeps the mood calm and minimal, with each section living on its own page so the experience feels easier to explore.
          </p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="about.html">About me</a>
            <a class="btn btn-secondary" href="projects.html">Projects</a>
            <a class="section-link" href="archives.html">Archives</a>
            <a class="section-link" href="button.html">Button</a>
            <a class="section-link" href="cydiarepo.html">Cydia Repo</a>
            <a class="section-link" href="socials.html">Socials</a>
            <a class="section-link" href="tech.html">Tech</a>
            <a class="section-link" href="tech2.html">Tech2</a>
          </div>
        </div>

        <div class="hero-card" aria-hidden="true">
          <div class="orb"></div>
        </div>
      </section>
    </main>

    <script>
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      let width = 0;
      let height = 0;
      let particles = [];

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = Array.from({ length: Math.min(60, Math.floor(width / 24)) }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 1.4 + 0.4,
          vx: (Math.random() - 0.5) * 0.2,
          vy: (Math.random() - 0.5) * 0.2,
          alpha: Math.random() * 0.4 + 0.15
        }));
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < -5 || p.x > width + 5) p.vx *= -1;
          if (p.y < -5 || p.y > height + 5) p.vy *= -1;
          ctx.beginPath();
          ctx.fillStyle = `rgba(160, 32, 240, ${p.alpha})`;
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        });
        requestAnimationFrame(animate);
      }

      window.addEventListener('resize', resize);
      resize();
      animate();
    </script>
  </body>
</html>
